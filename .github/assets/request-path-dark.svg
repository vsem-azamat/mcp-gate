<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 425" width="990" height="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How mcp-gate handles a call</title>
<desc id="d">Agents call one endpoint per server with a named token. mcp-gate checks the token and the filters, forwards the call to a stdio or HTTP server, then redacts secrets, scans downloaded files and writes an audit line before the result goes back. Redacted values can be kept in an in-memory escrow that only the owner key opens.</desc>
<defs>
<marker id="a-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4493f8"/></marker>
<marker id="a-res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
<marker id="a-esc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ab7df8"/></marker>
<marker id="a-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker>
</defs>
<text x="30" y="34" font-size="11.5" font-weight="600" fill="#9198a1" text-anchor="start">CLIENTS</text>
<text x="485" y="34" font-size="11.5" font-weight="600" fill="#9198a1" text-anchor="middle">MCP-GATE</text>
<text x="960" y="34" font-size="11.5" font-weight="600" fill="#9198a1" text-anchor="end">SERVERS</text>
<rect x="30" y="70" width="170" height="58" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="44" y="93" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">Claude Code</text>
<text x="44" y="112" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">token: laptop</text>
<rect x="30" y="152" width="170" height="58" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="44" y="175" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">Codex</text>
<text x="44" y="194" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">token: server</text>
<rect x="30" y="234" width="170" height="58" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="44" y="257" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">Phone agent</text>
<text x="44" y="276" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">token: phone</text>
<rect x="250" y="50" width="470" height="356" rx="16" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="270" y="80" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/&lt;server&gt;/mcp</text>
<text x="700" y="80" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">one endpoint per server</text>
<text x="270" y="102" font-size="11.5" font-weight="600" fill="#4493f8" text-anchor="start">request</text>
<rect x="276.0" y="112" width="118" height="54" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="335" y="135" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Token</text>
<text x="335" y="153" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">named, per client</text>
<rect x="426.0" y="112" width="118" height="54" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="485" y="135" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Filters</text>
<text x="485" y="153" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">tools, prompts, res.</text>
<rect x="576.0" y="112" width="118" height="54" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="635" y="135" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Forward</text>
<text x="635" y="153" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">stdio or HTTP</text>
<path d="M394 139 H422" fill="none" stroke="#4493f8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-req)"/>
<path d="M544 139 H572" fill="none" stroke="#4493f8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-req)"/>
<text x="270" y="208" font-size="11.5" font-weight="600" fill="#3fb950" text-anchor="start">result</text>
<rect x="576.0" y="218" width="118" height="54" rx="8" fill="#04260f" stroke="#3fb950" stroke-width="1.5"/>
<text x="635" y="241" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Redact</text>
<text x="635" y="259" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">fails closed</text>
<rect x="426.0" y="218" width="118" height="54" rx="8" fill="#04260f" stroke="#3fb950" stroke-width="1.5"/>
<text x="485" y="241" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Scan files</text>
<text x="485" y="259" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">withhold secrets</text>
<rect x="276.0" y="218" width="118" height="54" rx="8" fill="#04260f" stroke="#3fb950" stroke-width="1.5"/>
<text x="335" y="241" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Audit</text>
<text x="335" y="259" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">who, what, outcome</text>
<path d="M576 245 H548" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-res)"/>
<path d="M426 245 H398" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-res)"/>
<rect x="555" y="340" width="160" height="48" rx="8" fill="#271052" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="635.0" y="360" font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Escrow</text>
<text x="635.0" y="377" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">in memory, optional</text>
<path d="M635 272 V336" fill="none" stroke="#ab7df8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#a-esc)"/>
<text x="643" y="312" font-size="11" font-weight="400" fill="#ab7df8" text-anchor="start">kept values</text>
<path d="M865 364 H721" fill="none" stroke="#ab7df8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-esc)"/>
<text x="871" y="360" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="start">owner key</text>
<text x="871" y="376" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GET /_escrow/…</text>
<text x="270" y="360" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Kept for the owner, released only</text>
<text x="270" y="377" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">with a separate key, never to clients</text>
