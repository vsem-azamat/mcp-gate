<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How mcp-gate handles a call</title>
<desc id="d">AI agents call mcp-gate, each with its own token. The gate authenticates the caller, checks that the tool is allowed and forwards the call to one MCP server. The result comes back through redaction of secrets, a scan of downloaded files and an audit log. Denied calls go straight back. Optionally, redacted secrets are kept in memory for the owner, who reads them with a separate key.</desc>
<defs>
<marker id="a-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
<marker id="a-res" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
<marker id="a-esc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8250df"/></marker>
<marker id="a-deny" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker>
</defs>
<text x="130" y="44" font-size="18" font-weight="600" fill="#1f2328" text-anchor="middle">AI agents</text>
<text x="600.0" y="44" font-size="18" font-weight="600" fill="#1f2328" text-anchor="middle">mcp-gate</text>
<text x="1070" y="44" font-size="18" font-weight="600" fill="#1f2328" text-anchor="middle">MCP servers</text>
<rect x="30" y="138" width="200" height="64" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="130.0" y="177.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Claude Code</text>
<rect x="30" y="228" width="200" height="64" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="130.0" y="267.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Codex</text>
<rect x="30" y="318" width="200" height="64" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="130.0" y="357.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Cursor</text>
<text x="130" y="416" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="middle">each with its own token</text>
