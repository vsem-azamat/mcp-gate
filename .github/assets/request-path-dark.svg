<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How mcp-gate handles a call</title>
<desc id="d">AI agents call mcp-gate, each with its own token. The gate authenticates the caller, checks that the tool is allowed and forwards the call to one MCP server. The result comes back through redaction of secrets, a scan of downloaded files and an audit log. Denied calls go straight back. Optionally, redacted secrets are kept in memory for the owner, who reads them with a separate key.</desc>
<defs>
<marker id="a-req" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4493f8"/></marker>
<marker id="a-res" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
<marker id="a-esc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ab7df8"/></marker>
<marker id="a-deny" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
</defs>
<text x="130" y="44" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="middle">AI agents</text>
<text x="600.0" y="44" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="middle">mcp-gate</text>
<text x="1070" y="44" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="middle">MCP servers</text>
<rect x="30" y="138" width="200" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="130.0" y="177.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Claude Code</text>
<rect x="30" y="228" width="200" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="130.0" y="267.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Codex</text>
<rect x="30" y="318" width="200" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="130.0" y="357.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Cursor</text>
<text x="130" y="416" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">each with its own token</text>
<path d="M230 170 H262" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M230 260 H262" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M230 350 H262" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M262 170 V350" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300" y="70" width="600" height="460" rx="18" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="325" y="120" font-size="15" font-weight="600" fill="#4493f8" text-anchor="start">request →</text>
<rect x="326.0" y="133.0" width="168" height="74" rx="10" fill="#151b23" stroke="#4493f8" stroke-width="2"/>
<text x="410.0" y="167.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Authenticate</text>
<text x="410.0" y="189.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">who is calling</text>
<rect x="516.0" y="133.0" width="168" height="74" rx="10" fill="#151b23" stroke="#4493f8" stroke-width="2"/>
<text x="600.0" y="167.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Filter</text>
<text x="600.0" y="189.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">allowed tools only</text>
<rect x="706.0" y="133.0" width="168" height="74" rx="10" fill="#151b23" stroke="#4493f8" stroke-width="2"/>
<text x="790.0" y="167.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Forward</text>
<text x="790.0" y="189.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">to that one server</text>
<path d="M262 170 H322.0" fill="none" stroke="#4493f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-req)"/>
<path d="M494.0 170 H512.0" fill="none" stroke="#4493f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-req)"/>
