<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How mcp-gate handles a call</title>
<desc id="d">AI agents call mcp-gate, each with its own token. The gate authenticates the caller, checks that the tool is allowed and forwards the call to one MCP server. The result comes back through hiding of secrets in answers and in downloaded files, and a log. Calls that are not allowed are blocked. Optionally, redacted secrets are kept in memory for the owner, who reads them with a separate key.</desc>
