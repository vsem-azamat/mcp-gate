version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forcetypeassert
    - gosec
    - intrange
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck reports these
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      # Test helpers keep explicit arguments so call sites read like the scenario.
      - path: _test\.go
        linters: [unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vsem-azamat/mcp-gate
  exclusions:
    generated: strict
