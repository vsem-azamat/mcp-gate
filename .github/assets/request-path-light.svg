<text x="790.0" y="167.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Forward</text>
<text x="790.0" y="189.0" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="middle">/notes/mcp → notes</text>
