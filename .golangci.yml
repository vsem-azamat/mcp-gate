version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gosec
    - intrange
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    depguard:
      rules:
        mcp-library:
          list-mode: lax
          deny:
            - pkg: github.com/mark3labs/mcp-go
              desc: github.com/modelcontextprotocol/go-sdk is the only MCP library
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to an io.Writer; only cmd/ prints
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: only cmd/ reads the environment; pass values in
        - pattern: ^log\.
          pkg: ^log$
          msg: use log/slog, not the standard log package
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck reports these
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      # Test helpers keep explicit arguments so call sites read like the scenario.
      - path: _test\.go
        linters: [unparam]
      # The command is where output is printed and the environment is read.
      - path: ^cmd/
        linters: [forbidigo]
        text: (fmt\.Print|os\.(Getenv|LookupEnv|Environ))

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vsem-azamat/mcp-gate
  exclusions:
    generated: strict
