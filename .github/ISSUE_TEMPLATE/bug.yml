name: Bug report
description: Something in mcp-gate does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Issues are public. Never paste `gate.env`, client or admin tokens, the escrow key, OAuth grants, `/_status` output, or anything else that holds a secret.** Replace real tokens, hostnames and URLs with placeholders such as `server-a` or `https://mcp.example.com`.

        A security problem goes to a [private vulnerability report](https://github.com/vsem-azamat/mcp-gate/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `mcp-gate version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: linux/amd64
    validations:
      required: true
  - type: dropdown
    id: runs-as
    attributes:
      label: How it runs
      options:
        - systemd system unit
        - systemd user unit
        - other (describe below)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config, with secrets removed
      description: The smallest `gate.yaml` that shows the problem. Keep `${VAR}` references; never their values.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant log lines (for systemd, `journalctl -u mcp-gate`, or with `--user` for the user unit). Check them for secrets before pasting.
      render: text
