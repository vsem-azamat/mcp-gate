# Release builds of mcp-gate for a v* tag; .github/workflows/release.yml runs it.
version: 2

project_name: mcp-gate

builds:
  - id: mcp-gate
    main: ./cmd/mcp-gate
    binary: mcp-gate
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # the tag itself; mcp-gate version shows it. A snapshot gets none, so it is not taken for a
      # release: mcp-gate version then says dev
      - -s -w -X github.com/vsem-azamat/mcp-gate/internal/version.Version={{ if not .IsSnapshot }}{{ .Tag }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        # The binary smoke test (internal/smoke) against each built binary this machine can run,
        # before anything is packed or published.
        - cmd: >-
            {{ if and (eq .Os .Runtime.Goos) (eq .Arch .Runtime.Goarch) }}go test -count=1 ./internal/smoke -args -binary={{ .Path }}{{ else }}true{{ end }}
          output: true

archives:
  - id: mcp-gate
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # fixed file times and owners, so the same commit gives the same archives and checksums
    builds_info:
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
      mode: 0755
    files:
      - src: LICENSE
        info: &file-info
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0644
      - src: README.md
        info: *file-info
      - src: packaging/systemd/mcp-gate.service
        info: *file-info
      - src: packaging/systemd/mcp-gate.socket
        info: *file-info
      - src: packaging/systemd/user/mcp-gate.service
        info: *file-info
      - src: packaging/systemd/user/mcp-gate.socket
        info: *file-info

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  # Dependabot titles updates of the product's module fix(deps), so they stay in; updates of the
  # tools and actions are chore and are left out.
  filters:
    exclude:
      - "^(build|chore|ci|docs|style|test)(\\(.+\\))?!?:"
  groups:
    - title: Features
      regexp: "^feat(\\(.+\\))?!?:"
      order: 0
    - title: Fixes
      regexp: "^fix(\\(.+\\))?!?:"
      order: 1
    - title: Other changes
      order: 999

release:
  draft: false
  prerelease: auto
