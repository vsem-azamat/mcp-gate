<text x="790.0" y="369.0" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="middle">strip secrets</text>
<rect x="516.0" y="313.0" width="168" height="74" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
<text x="600.0" y="347.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Scan files</text>
<text x="600.0" y="369.0" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="middle">secrets in downloads</text>
<rect x="326.0" y="313.0" width="168" height="74" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
<text x="410.0" y="347.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Audit log</text>
<text x="410.0" y="369.0" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="middle">who did what</text>
<path d="M706.0 350 H688.0" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-res)"/>
