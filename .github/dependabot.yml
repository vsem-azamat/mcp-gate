version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tools
      - /tools/lint
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
