<rect x="690" y="432" width="200" height="70" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2" stroke-dasharray="6 4"/>
<text x="790.0" y="464.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Escrow</text>
<text x="790.0" y="486.0" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="middle">optional</text>
<text x="670" y="462" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="end">redacted secrets kept in memory;</text>
