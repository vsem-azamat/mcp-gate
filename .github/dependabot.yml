version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    # fix(deps): the release changelog keeps fix and leaves out chore, and these reach the binary
    commit-message:
      prefix: fix
      include: scope

  # Only the tools themselves are updated. Their other requirements are indirect and are
  # pinned to what each tool was released with: bumping them on their own breaks the build.
  - package-ecosystem: gomod
    directories:
      - /tools
      - /tools/lint
    allow:
      - dependency-name: github.com/editorconfig-checker/editorconfig-checker/v3
      - dependency-name: github.com/rhysd/actionlint
      - dependency-name: golang.org/x/vuln
      - dependency-name: github.com/golangci/golangci-lint/v2
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
