<rect x="300" y="70" width="600" height="460" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="325" y="120" font-size="15" font-weight="600" fill="#0969da" text-anchor="start">request →</text>
<rect x="326.0" y="133.0" width="168" height="74" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
<text x="410.0" y="167.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Authenticate</text>
<text x="410.0" y="189.0" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="middle">who is calling</text>
<rect x="516.0" y="133.0" width="168" height="74" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
<text x="600.0" y="167.0" font-size="19" font-weight="600" fill="#1f2328" text-anchor="middle">Filter</text>
<text x="600.0" y="189.0" font-size="14.5" font-weight="400" fill="#59636e" text-anchor="middle">allowed tools only</text>
