<path d="M570 207.0 V260 H268" fill="none" stroke="#f85149" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a-deny)"/>
<text x="410" y="250" font-size="14.5" font-weight="600" fill="#f85149" text-anchor="middle">denied</text>
<text x="325" y="300" font-size="15" font-weight="600" fill="#3fb950" text-anchor="start">← result</text>
<rect x="706.0" y="313.0" width="168" height="74" rx="10" fill="#151b23" stroke="#3fb950" stroke-width="2"/>
<text x="790.0" y="347.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Redact</text>
<text x="790.0" y="369.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">strip secrets</text>
<rect x="516.0" y="313.0" width="168" height="74" rx="10" fill="#151b23" stroke="#3fb950" stroke-width="2"/>
<text x="600.0" y="347.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Scan files</text>
<text x="600.0" y="369.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">downloads too</text>
<rect x="326.0" y="313.0" width="168" height="74" rx="10" fill="#151b23" stroke="#3fb950" stroke-width="2"/>
<text x="410.0" y="347.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Audit log</text>
<text x="410.0" y="369.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">who did what</text>
<path d="M706.0 350 H688.0" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-res)"/>
<path d="M516.0 350 H498.0" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-res)"/>
<path d="M326.0 350 H268" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-res)"/>
<path d="M790 387.0 V428" fill="none" stroke="#ab7df8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#a-esc)"/>
<rect x="690" y="432" width="200" height="70" rx="10" fill="#151b23" stroke="#ab7df8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="790.0" y="464.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">Escrow</text>
<text x="790.0" y="486.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">optional</text>
<text x="670" y="462" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="end">redacted secrets kept in memory;</text>
<text x="670" y="483" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="end">only your owner key reads them</text>
<path d="M790 578 V506" fill="none" stroke="#ab7df8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-esc)"/>
<text x="802" y="568" font-size="14.5" font-weight="600" fill="#ab7df8" text-anchor="start">owner key</text>
<rect x="970" y="138" width="200" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="1070.0" y="167.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">notes</text>
<text x="1070.0" y="189.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">local</text>
<path d="M938 170 H970" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="970" y="228" width="200" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="1070.0" y="257.0" font-size="19" font-weight="600" fill="#f0f6fc" text-anchor="middle">files</text>
<text x="1070.0" y="279.0" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="middle">local</text>
<path d="M938 260 H970" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
